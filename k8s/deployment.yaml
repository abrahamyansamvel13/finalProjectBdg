apiVersion: apps/v1
kind: Deployment

metadata:
  name: genesis-deployment
  namespace: default

spec:
  replicas: 3

  selector:
    matchLabels:
      app: genesis

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: genesis

    spec:
      containers:
        - name: genesis
          image: nginx:latest
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: genesis-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genesis-db-creds
                  key: DB_PASSWORD

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: genesis-db-creds
                  key: DB_USER
