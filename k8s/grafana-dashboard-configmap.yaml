# Phase 6 (Extra Mile): Auto-Provision the Dashboard
# This ConfigMap wraps the dashboard JSON so Grafana auto-imports it
apiVersion: v1
kind: ConfigMap
metadata:
  name: gaming-stats-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"  # Required: tells Grafana sidecar to auto-import
    app: gaming-stats-api
data:
  genesis-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (status_code) (rate(http_requests_total{namespace=\"default\"}[5m]))",
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"default\",status_code=~\"5..\"}[5m]))",
              "refId": "A"
            }
          ],
          "title": "Error Rate",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{namespace=\"default\"}[5m])))",
              "refId": "A"
            }
          ],
          "title": "Latency p95",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"gaming-stats-api.*\"}[5m])) * 100",
              "refId": "A"
            }
          ],
          "title": "CPU Usage",
          "type": "gauge"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"gaming-stats-api.*\"}) / 1024 / 1024",
              "refId": "A"
            }
          ],
          "title": "Memory Usage",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 16,
      "style": "dark",
      "tags": ["gaming-stats", "prometheus"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Gaming Stats API Dashboard",
      "uid": "gaming-stats-api",
      "version": 0
    }
